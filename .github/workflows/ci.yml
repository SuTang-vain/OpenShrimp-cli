name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Go tests and lint
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Run Go tests
        run: go test ./... -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  # Go build check
  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build binary
        run: go build -o ai-mgr .

      - name: Verify binary
        run: |
          ./ai-mgr version
          file ai-mgr

  # UI tests and build
  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ./ui
        run: npm ci

      - name: Run UI type check
        working-directory: ./ui
        run: npx vue-tsc --noEmit

      - name: Build UI
        working-directory: ./ui
        run: npm run build

      - name: Upload UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 7

  # Multi-platform build
  cross-build:
    name: Cross-platform Build
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build for Darwin AMD64
        run: GOOS=darwin GOARCH=amd64 go build -o ai-mgr-darwin-amd64 .

      - name: Build for Darwin ARM64
        run: GOOS=darwin GOARCH=arm64 go build -o ai-mgr-darwin-arm64 .

      - name: Build for Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -o ai-mgr-linux-amd64 .

      - name: Build for Linux ARM64
        run: GOOS=linux GOARCH=arm64 go build -o ai-mgr-linux-arm64 .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            ai-mgr-darwin-amd64
            ai-mgr-darwin-arm64
            ai-mgr-linux-amd64
            ai-mgr-linux-arm64
          retention-days: 7

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Go vulnerability scan
        uses: anchore/sbom-action@v0
        with:
          dependency-snapshot: true
          format: spdx-json
          output-file: ${{ github.event.repository.name }}-sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: '*-sbom.spdx.json'
          retention-days: 365

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run linter
        run: golangci-lint run ./...
