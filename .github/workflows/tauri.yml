name: Tauri Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform (macos, linux, windows)'
        required: false
        default: 'all'
      debug:
        description: 'Build debug version'
        required: false
        default: 'false'

jobs:
  tauri-build:
    name: Build Tauri App
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
          - os: macos-latest
            platform: macos
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install cairo pango jpeg giflib librsvg

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install -y webview2

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock') }}

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('ui/package-lock.json') }}

      - name: Install UI dependencies
        working-directory: ./ui
        run: npm ci

      - name: Build UI
        working-directory: ./ui
        run: npm run build

      - name: Build Tauri app
        working-directory: ./tauri
        run: |
          cargo fetch
          cargo build --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}-${{ matrix.target }}
          path: tauri/src-tauri/target/release/bundle/
          retention-days: 7

  bundle:
    name: Create DMG/DEB/MSI
    runs-on: macos-latest
    needs: tauri-build
    if: github.event_name == 'release' && contains(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release bundle
        run: |
          echo "Bundling macOS artifacts..."
          # Create .dmg or .pkg as needed
          ls -la artifacts/
